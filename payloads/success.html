<!DOCTYPE html>
<html>
<head>
    <title>Login Successful</title>
    <style>
        body { font-family: Arial; background: #f0f2f5; text-align: center; padding: 50px; }
        .success { background: white; padding: 40px; border-radius: 10px; display: inline-block; }
        .check { color: #42b72a; font-size: 60px; }
        h1 { color: #1c1e21; }
        p { color: #65676b; }
    </style>
</head>
<body>
    <div class="success">
        <div class="check">✓</div>
        <h1>Login Successful!</h1>
        <p>You are now connected to the WiFi network.</p>
        <p>You can now browse the internet.</p>
        <p><small>(Note: Internet access is limited on this free WiFi)</small></p>
    </div>
</body>
</html>
