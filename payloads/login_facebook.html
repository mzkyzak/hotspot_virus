<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Log In or Sign Up</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            display: flex;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .logo-section {
            flex: 1;
            padding: 40px 0;
        }
        
        .logo {
            font-size: 48px;
            color: #1877f2;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .slogan {
            font-size: 24px;
            color: #1c1e21;
        }
        
        .login-box {
            flex: 1;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0,0,0,.1), 0 8px 16px rgba(0,0,0,.1);
            padding: 20px;
            max-width: 400px;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            box-sizing: border-box;
        }
        
        input:focus {
            outline: none;
            border-color: #1877f2;
        }
        
        .login-btn {
            width: 100%;
            background: #1877f2;
            color: white;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        
        .login-btn:hover {
            background: #166fe5;
        }
        
        .forgot {
            text-align: center;
            display: block;
            color: #1877f2;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .divider {
            border-top: 1px solid #dadde1;
            margin: 20px 0;
        }
        
        .create-btn {
            width: 60%;
            background: #42b72a;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 0 auto;
            display: block;
        }
        
        .create-btn:hover {
            background: #36a420;
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #737373;
        }
        
        #loading {
            display: none;
            text-align: center;
            color: green;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <div class="logo">facebook</div>
            <div class="slogan">Connect with friends and the world around you on Facebook.</div>
        </div>
        
        <div class="login-box">
            <form id="loginForm">
                <div class="input-group">
                    <input type="text" id="email" placeholder="Email address or phone number" required>
                </div>
                
                <div class="input-group">
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                
                <button type="submit" class="login-btn">Log In</button>
                
                <a href="#" class="forgot">Forgotten password?</a>
                
                <div class="divider"></div>
                
                <button type="button" class="create-btn">Create New Account</button>
            </form>
            
            <div id="loading">
                <p>✓ Logging you in...</p>
            </div>
            
            <div class="footer">
                <p><a href="#">Create a Page</a> for a celebrity, brand or business.</p>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            
            // Simulate login process
            setTimeout(function() {
                document.getElementById('loading').innerHTML = 
                    '<p>✓ Login successful! Redirecting to Facebook...</p>';
                
                // Redirect after 2 seconds
                setTimeout(function() {
                    window.location.href = 'https://www.facebook.com';
                }, 2000);
            }, 1500);
        });
        
        // Add some security theater
        window.addEventListener('load', function() {
            console.log('Facebook security initialized...');
        });
    </script>
</body>
</html>
